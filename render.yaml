services:
  - type: web
    name: chatapp-shashank27589
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev --prefix Backend && npm ci --include=dev --prefix Frontend && npm run build --prefix Frontend
    startCommand: node Backend/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: chatapp
      - key: MONGODB_URI
        sync: false
      - key: JWT_TOKEN
        generateValue: true
